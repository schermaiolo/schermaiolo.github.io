<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0c11">
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}schermaiolo.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body class="{% if page.nav == 'home' %}home-page{% endif %}{% if page.archive_page %}{% if page.nav == 'home' %} {% endif %}archive-page{% endif %}">
  <div class="wrap{% if page.nav == 'home' %} home-shell{% endif %}">
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
  </div>

  {% include contact-board.html %}
  <script src="{{ '/assets/js/contact-board.js' | relative_url }}" defer></script>
</body>
</html>
