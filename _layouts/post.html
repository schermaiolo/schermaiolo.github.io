---
layout: default
---
<main class="page-main">
  <a class="back-link" href="{{ '/log/' | relative_url }}">← go back</a>
  <p class="page-kicker">/log</p>
  <h1>{{ page.title }}</h1>
  <p class="page-intro"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d %b %Y' }}</time>{% if page.tags %} · {{ page.tags | join: ' · ' }}{% endif %}</p>
  <article class="post-content">{{ content }}</article>
  <div class="content-actions"><a class="sponsor-link" href="https://github.com/sponsors/schermaiolo" target="_blank" rel="noopener">♡ sponsor</a></div>
</main>
